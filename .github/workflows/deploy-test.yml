name: Deploy to phytoexp.live

on:
  push:
    branches: [test]

# Least privilege: the job only checks out code and deploys to Cloudflare; it
# never writes back to the repo, so the default GITHUB_TOKEN needs read-only.
permissions:
  contents: read

jobs:
  # Broken pushes must not reach phytoexp.live: run the same lint/typecheck/
  # test/build checks as PRs, and only deploy when they pass.
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: CLOUDFLARE_ENV=test bunx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: test

      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
