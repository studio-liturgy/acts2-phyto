name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets deploy-test.yml reuse these checks as a gate before deploying.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      # vite.config.ts aborts without the VITE_ vars, so a fork PR (no secrets)
      # fails here loudly rather than deploying something unbuilt.
      - name: Build
        run: bunx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
