<!DOCTYPE html>
<!--
  LOCAL PREVIEW ONLY. Source of truth is email-templates/magic-link.html.
  Differences: asset URLs are relative (/email/...) so the dev server serves them,
  fonts load from /fonts/, and {{ .ConfirmationURL }} is replaced with "#".
  Open at http://localhost:8080/email/preview.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <title>Preview — phyto magic link</title>
    <style>
      @font-face {
        font-family: 'Space Mono';
        src: url('/fonts/SpaceMono-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
      }
      @media only screen and (max-width:600px) {
        .col { display:block !important; width:100% !important; }
        .btn-cell { text-align:left !important; padding:24px 0 0 !important; }
        .h1 { font-size:34px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#2E7299;font-family:Arial,Helvetica,sans-serif;letter-spacing:-0.03em;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Here's your secure link to sign in to phyto. It expires shortly.</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#2E7299;">
      <tr>
        <td align="center" style="padding:0;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

            <!-- HERO -->
            <tr>
              <td style="padding:0;font-size:0;line-height:0;">
                <img src="/email/magic-link-header.png" width="600" alt="phyto"
                     style="display:block;width:100%;max-width:600px;height:auto;border:0;" />
              </td>
            </tr>

            <!-- BODY -->
            <tr>
              <td style="padding:44px 40px 40px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td class="col" valign="middle" width="58%" style="vertical-align:middle;">
                      <h1 class="h1" style="margin:0;color:#F5EFEF;font-family:Arial,Helvetica,sans-serif;font-size:40px;line-height:1.05;font-weight:400;letter-spacing:-0.045em;">
                        Here's your link!
                      </h1>
                    </td>
                    <td class="col btn-cell" valign="middle" width="42%" align="right" style="vertical-align:middle;text-align:right;">
                      <a href="#"
                         style="display:inline-block;border:1.5px solid #F5EFEF;border-radius:9999px;color:#F5EFEF;font-family:Arial,Helvetica,sans-serif;font-size:34px;line-height:1;letter-spacing:-0.045em;text-decoration:none;padding:18px 34px;white-space:nowrap;">
                        Sign In&nbsp;&nbsp;<img src="/email/arrow.png" width="22" height="22" alt="&#8599;" style="vertical-align:baseline;border:0;" />
                      </a>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2" style="padding-top:54px;text-align:center;">
                      <p style="margin:0;color:#dce8ef;font-size:13px;line-height:1.6;">
                        Before going online, we recommend reviewing the
                        <a href="#" style="color:#F5EFEF;text-decoration:underline;">Terms of Use</a>
                        and
                        <a href="#" style="color:#F5EFEF;text-decoration:underline;">Privacy Policy</a>.
                      </p>
                      <p style="margin:2px 0 0;color:#bcd2dd;font-size:12px;line-height:1.6;">
                        If you didn't request this, you can safely ignore this email.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- DIVIDER (inset to match body content width) -->
            <tr>
              <td style="padding:0 40px;">
                <div style="border-top:1px solid rgba(245,239,239,0.2);font-size:0;line-height:0;">&nbsp;</div>
              </td>
            </tr>

            <!-- FOOTER -->
            <tr>
              <td align="center" style="padding:24px 40px 48px;">
                <a href="#" style="color:#F5EFEF;font-family:'Space Mono',Courier,monospace;font-size:12px;letter-spacing:0;text-transform:uppercase;text-decoration:none;padding:0 16px;">About</a>
                <a href="#" style="color:#F5EFEF;font-family:'Space Mono',Courier,monospace;font-size:12px;letter-spacing:0;text-transform:uppercase;text-decoration:none;padding:0 16px;">Instagram</a>
                <a href="#" style="color:#F5EFEF;font-family:'Space Mono',Courier,monospace;font-size:12px;letter-spacing:0;text-transform:uppercase;text-decoration:none;padding:0 16px;">Donate</a>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
